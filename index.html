<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessWild | Inclusive Nature Mapping</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header role="banner">
        <div class="header-content">
            <h1>AccessWild 🌲♿</h1>
            <button id="theme-toggle" aria-pressed="false">Toggle High Contrast</button>
        </div>
    </header>

    <main class="app-container">
        <!-- MAP SECTION -->
        <section id="map-section" aria-label="Interactive Map">
            <div id="map-hint" class="map-hint" aria-live="polite">
                <span id="map-hint-text">💡 Tap or click anywhere on the map to place a pin.</span>
            </div>
            <div id="map" role="application" aria-label="Map showing accessible recreation points"></div>
        </section>

        <!-- DATA & SEARCH SIDEBAR -->
        <aside class="sidebar" aria-label="Controls and Locations">
            <section id="form-container" aria-labelledby="form-heading">
                <h2 id="form-heading">Add Accessible Point</h2>
                
                <!-- Status Banner: Explains current pin selection clearly -->
                <div id="selection-status" class="selection-status" aria-live="polite">
                    <span>📍</span>
                    <span id="selection-status-text">No spot selected yet. Tap the map or use the buttons below.</span>
                    <button type="button" id="clear-pin-btn" class="clear-pin-btn" style="display: none;" aria-label="Clear selected pin">Clear</button>
                </div>

                <form id="add-location-form">
                    <div class="form-group">
                        <label for="loc-name">Location Name</label>
                        <input type="text" id="loc-name" name="name" required aria-required="true" placeholder="e.g. South Fork Campground">
                    </div>

                    <div class="form-group">
                        <label for="loc-type">Facility Type</label>
                        <select id="loc-type" name="type">
                            <option value="Restroom">Accessible Restroom</option>
                            <option value="Trail">Level Trail</option>
                            <option value="Parking">Reserved Parking</option>
                            <option value="Overlook">Accessible Viewpoint / Overlook</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="coords">Coordinates</label>
                        <input type="text" id="coords" name="coordinates" required readonly placeholder="Tap map or use buttons below">
                    </div>

                    <!-- Easy Buttons: Motor/Cognitive Accessible -->
                    <div class="button-row">
                        <button type="button" id="center-pin-btn" class="secondary-btn" aria-label="Place pin in current center of map">📍 Pin Map Center</button>
                        <button type="button" id="use-gps-btn" class="secondary-btn" aria-label="Use current device GPS location">📍 Use Current GPS</button>
                    </div>

                    <button type="submit" class="submit-btn">Save Location</button>
                </form>
            </section>

            <!-- ACCESSIBLE LOCATIONS DIRECTORY -->
            <section class="locations-container" aria-labelledby="locations-heading">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="locations-heading" style="margin: 0; font-size: 1.25rem;">Live Points (<span id="points-count">0</span>)</h2>
                    <button type="button" id="export-btn" class="secondary-btn" style="width: auto; min-height: 36px; padding: 0.3rem 0.8rem; font-size: 0.85rem;">Export GeoJSON</button>
                </div>
                <p id="list-instructions" style="font-size: 0.85rem; margin-top: 0.4rem; opacity: 0.85;">⚡ Powered by Cloud Firestore. Updates sync live across all visitors.</p>
                <ul id="locations-list" class="locations-list" role="list">
                    <!-- Populated dynamically via Firebase onSnapshot -->
                </ul>
            </section>
        </aside>
    </main>

    <!-- Screen Reader Announcement Area -->
    <div id="announcements" class="sr-only" aria-live="polite"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Modular App Script with Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
