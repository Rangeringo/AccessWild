<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessWild | Inclusive Nature Mapping</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header role="banner">
        <div class="header-content">
            <h1>AccessWild</h1>
            <button id="theme-toggle" aria-pressed="false">Toggle High Contrast</button>
        </div>
    </header>

    <main class="app-container">
        <!-- MAP SECTION -->
        <section id="map-section" aria-label="Interactive Map">
            <div id="map" role="application" aria-label="Map showing accessible recreation points"></div>
        </section>

        <!-- DATA & SEARCH SIDEBAR -->
        <aside class="sidebar">
            <section id="form-container" aria-labelledby="form-heading">
                <h2 id="form-heading">Add Accessible Point</h2>
                <form id="add-location-form">
                    <div class="form-group">
                        <label for="loc-name">Location Name</label>
                        <input type="text" id="loc-name" name="name" required aria-required="true" placeholder="e.g. Blue Lake Trailhead">
                    </div>

                    <div class="form-group">
                        <label for="loc-type">Facility Type</label>
                        <select id="loc-type" name="type">
                            <option value="Restroom">Accessible Restroom</option>
                            <option value="Trail">Level Trail</option>
                            <option value="Ramp">Boat/Water Ramp</option>
                            <option value="Parking">Reserved Parking</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="coords">Coordinates</label>
                        <input type="text" id="coords" name="coordinates" readonly placeholder="Click map to set location">
                    </div>

                    <button type="submit" class="submit-btn">Save Location</button>
                </form>
            </section>
        </aside>
    </main>

    <!-- Hidden Screen Reader Announcement Area -->
    <div id="announcements" class="sr-only" aria-live="polite"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
