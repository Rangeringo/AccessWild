<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessWild | Inclusive Outdoor Mapping</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<header role="banner">
    <div class="header-content">
        <h1>AccessWild</h1>
        <button id="theme-toggle" aria-pressed="false">Toggle High Contrast</button>
    </div>
</header>

    <main class="app-container">
        <section id="map-section" aria-label="Interactive Map">
            <div id="map" role="application" aria-label="Outdoor accessibility map"></div>
        </section>

        <aside id="sidebar" class="sidebar">
            <section id="controls" aria-labelledby="filter-heading">
                <h2 id="filter-heading">Search & Filters</h2>
                <!-- Step 3 Content will go here -->
            </section>
            
            <section id="announcements" class="sr-only" aria-live="polite"></section>
        </aside>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2023 AccessWild Project. Data provided by BLM.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
